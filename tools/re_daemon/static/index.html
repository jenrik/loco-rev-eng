<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lego Loco Autonomous RE</title>
  <style>
    :root { color-scheme: dark; } body { font-family: ui-monospace, monospace; margin:2rem; background:#10151c; color:#d9e1e8; } h1,h2 { color:#8ec5ff; } h2 { margin-top:0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(22rem,1fr)); gap:1rem; } section { border:1px solid #3b4654; border-radius:.5rem; padding:1rem; background:#17212b; }
    form { display:grid; gap:.4rem; margin-bottom:1rem; } input,textarea,select,button { font:inherit; padding:.35rem; } textarea { min-height:4rem; } button { cursor:pointer; background:#254c70; color:#fff; border:1px solid #6088ac; border-radius:.25rem; } button.danger { background:#74343a; }
    .list { max-height:20rem; overflow:auto; } .item { border-top:1px solid #344454; padding:.5rem 0; } .muted { color:#9cabba; } .empty { color:#9cabba; font-style:italic; } #notice { min-height:1.2rem; } .ok { color:#83e58c; } .error { color:#ff9696; }
    .timeline-header { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; } .timeline-header label { display:flex; align-items:center; gap:.5rem; color:#b8c6d4; } .timeline-header select { min-width:20rem; max-width:100%; }
    #event-timeline { max-height:34rem; overflow:auto; border-top:1px solid #344454; } .event { border-left:3px solid #546779; border-bottom:1px solid #2e3b48; padding:.65rem .8rem; } .event.assistant { border-left-color:#6ea8e6; } .event.thinking { border-left-color:#9878d7; } .event.tool { border-left-color:#d3a85a; } .event.error { border-left-color:#df7272; } .event.system { border-left-color:#6fbd9c; }
    .event-meta { color:#90a1b0; font-size:.78rem; margin-bottom:.35rem; } .event-title { color:#d8e8f8; font-weight:bold; margin-bottom:.35rem; } .event-body { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.4; } .event details { margin-top:.4rem; color:#b8c6d4; } .event pre { margin:.4rem 0 0; max-height:12rem; overflow:auto; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>Autonomous Reverse Engineering</h1>
  <p id="connection">Connecting…</p><p id="ghidra"></p><p id="notice"></p>
  <div class="grid">
    <section><h2>Create job</h2><form id="job-form"><input name="title" placeholder="Title" required><textarea name="goal" placeholder="Evidence-led objective" required></textarea><button>Create job</button></form>
      <h2>Schedule ready work</h2><form id="schedule-form"><select name="jobId" required><option value="">Select job…</option></select><input name="limit" type="number" min="1" max="8" value="1"><button>Schedule</button></form><div id="jobs" class="list"></div></section>
    <section><h2>Create task</h2><form id="task-form"><select name="jobId" required><option value="">Select job…</option></select><input name="title" placeholder="Title" required><textarea name="instructions" placeholder="Concrete evidence-led instructions" required></textarea><select name="role"><option>investigator</option><option>transcriber</option><option>validator</option><option>integrator</option><option>reviewer</option></select><input name="writeScope" placeholder="Approved paths, comma separated"><button>Create task</button></form>
      <h2>Add dependency</h2><form id="dependency-form"><select name="taskId" required><option value="">Select waiting task…</option></select><select name="dependencyId" required><option value="">Select prerequisite task…</option></select><select name="relation"><option>requires</option><option>evidence</option><option>invalidates</option></select><button>Add edge</button></form><h2>Task edges</h2><div id="task-edges" class="list"></div></section>
    <section><h2>Control agent</h2><form id="agent-form"><select name="agentId" required><option value="">Select agent…</option></select><select name="action"><option>steer</option><option>follow_up</option><option>abort</option></select><textarea name="message" placeholder="Steer/follow-up message (not required for abort)"></textarea><button>Send</button></form><h2>Tasks</h2><div id="tasks" class="list"></div></section>
  </div>
  <div class="grid"><section><h2>Write-scope requests</h2><div id="scope-requests" class="list"></div></section><section><h2>Hypotheses</h2><div id="hypotheses" class="list"></div></section><section><h2>Agents</h2><div id="agents" class="list"></div></section></div>
  <section>
    <div class="timeline-header"><h2>Live event tail</h2><label>Agent <select id="event-agent"><option value="">All agents</option></select></label></div>
    <p id="event-summary" class="muted">Loading durable event history…</p><div id="event-timeline"></div>
  </section>
  <script>
    const $=selector=>document.querySelector(selector); const timeline=$('#event-timeline'), agentSelector=$('#event-agent'), summary=$('#event-summary');
    let sequence=0, refreshTimer=null, timelineEntries=[], currentAgents=[];
    const notice=(message,bad=false)=>{const node=$('#notice');node.textContent=message;node.className=bad?'error':'ok';setTimeout(()=>node.textContent='',5000);};
    async function api(path,options={}){const response=await fetch(path,{headers:{'content-type':'application/json'},...options});if(!response.ok)throw new Error((await response.text())||response.statusText);return response.json();}
    const element=(tag,text='',className='')=>{const node=document.createElement(tag);node.textContent=text;node.className=className;return node;};
    function action(label,handler,className=''){const button=element('button',label,className);button.type='button';button.onclick=handler;return button;}
    function renderItems(selector,records,render){const root=$(selector);const items=Array.isArray(records)?records:[];root.replaceChildren(...(items.length?items.map(render):[element('div','empty','empty')]));}
    function populateSelects(selector,records,placeholder,label){for(const select of document.querySelectorAll(selector)){const previous=select.value,items=Array.isArray(records)?records:[];const empty=element('option',placeholder);empty.value='';select.replaceChildren(empty,...items.map(item=>{const option=element('option',label(item));option.value=item.id;return option;}));select.value=items.some(item=>item.id===previous)?previous:'';}}
    function renderIdSelectors(state){const jobs=Array.isArray(state.jobs)?state.jobs:[],tasks=Array.isArray(state.tasks)?state.tasks:[],agents=Array.isArray(state.agents)?state.agents:[];populateSelects('select[name=jobId]',jobs,'Select job…',job=>job.title);populateSelects('select[name=taskId]',tasks,'Select waiting task…',task=>task.title);populateSelects('select[name=dependencyId]',tasks,'Select prerequisite task…',task=>task.title);const taskByAgent=new Map(tasks.filter(task=>task.assigned_agent_id).map(task=>[task.assigned_agent_id,task]));populateSelects('select[name=agentId]',agents,'Select agent…',agent=>`${agent.role} — ${taskByAgent.get(agent.id)?.title||'no assigned task'} (${agent.status})`);}
    function clipped(value,limit=2400){const serialized=typeof value==='string'?value:JSON.stringify(value,null,2);const text=serialized===undefined?'':serialized;return text.length>limit?`${text.slice(0,limit)}…`:text;}
    function agentName(id){const agent=currentAgents.find(item=>item.id===id);return agent?`${agent.role} · ${id.slice(0,12)}`:(id||'daemon');}
    function titleCase(value){return value.replaceAll('_',' ').replace(/\b\w/g,letter=>letter.toUpperCase());}
    function payloadText(value){if(typeof value==='string')return value;if(value&&typeof value.text==='string')return value.text;return clipped(value||'');}
    function entryFor(event){const payload=event.payload||{};if(event.kind==='assistant_delta'){const kind=payload.deltaType==='thinking_delta'?'thinking':'assistant';const prior=timelineEntries.at(-1);if(prior&&prior.kind===kind&&prior.agent_id===event.agent_id&&prior.lastSequence===event.sequence-1){prior.text+=payloadText(payload.delta);prior.lastSequence=event.sequence;prior.created_at=event.created_at;return prior;}return {kind,agent_id:event.agent_id,firstSequence:event.sequence,lastSequence:event.sequence,created_at:event.created_at,text:payloadText(payload.delta)};}
      const tool=payload.toolName||payload.toolCallId;let title=titleCase(event.kind);let body='';let details=null;let kind='system';
      if(event.kind==='tool_started'){title=`Tool started: ${tool||'unknown'}`;body=payload.args?clipped(payload.args,800):'';kind='tool';}
      else if(event.kind==='tool_finished'){title=`Tool ${payload.isError?'failed':'finished'}: ${tool||'unknown'}`;body=payload.isError?'Tool reported an error.':'Tool result available.';details=payload.result;kind=payload.isError?'error':'tool';}
      else if(event.kind==='ghidra_evidence_recorded'){title='Ghidra evidence recorded';body=payload.operation||'';kind='tool';}
      else if(event.kind==='ghidra_cache_hit'){title='Ghidra evidence cache hit';body=payload.operation||'';kind='tool';}
      else if(event.kind==='agent_stderr'||event.kind==='extension_error'||event.kind==='rpc_protocol_error'){body=clipped(payload);kind='error';}
      else {body=clipped(payload,1200);}
      return {kind,agent_id:event.agent_id,firstSequence:event.sequence,lastSequence:event.sequence,created_at:event.created_at,title,body,details};}
    function ingestEvent(event){if(event.sequence<=sequence)return;sequence=event.sequence;const entry=entryFor(event);if(timelineEntries.at(-1)!==entry)timelineEntries.push(entry);if(timelineEntries.length>250)timelineEntries=timelineEntries.slice(-250);renderTimeline();}
    function renderTimeline(){const selected=agentSelector.value;const entries=timelineEntries.filter(entry=>!selected||entry.agent_id===selected);timeline.replaceChildren(...(entries.length?entries.map(entry=>{const card=element('article','',`event ${entry.kind}`);card.append(element('div',`#${entry.firstSequence}${entry.lastSequence!==entry.firstSequence?`–${entry.lastSequence}`:''} · ${agentName(entry.agent_id)} · ${entry.created_at||''}`,'event-meta'));if(entry.title)card.append(element('div',entry.title,'event-title'));if(entry.text||entry.body)card.append(element('div',entry.text||entry.body,'event-body'));if(entry.details!=null){const details=document.createElement('details'), label=element('summary','Details');details.append(label);details.append(element('pre',clipped(entry.details)));card.append(details);}return card;}):[element('div','empty','empty')]));summary.textContent=`${entries.length} formatted event${entries.length===1?'':'s'}${selected?` for ${agentName(selected)}`:' across all agents'}; partial streamed messages are consolidated.`;timeline.scrollTop=timeline.scrollHeight;}
    function activitySequence(agentId){return timelineEntries.reduce((latest,entry)=>entry.agent_id===agentId?Math.max(latest,entry.lastSequence):latest,0);}
    function renderAgentSelector(agents){const previous=agentSelector.value;const ordered=[...agents].sort((left,right)=>((right.last_activity_sequence||activitySequence(right.id))-(left.last_activity_sequence||activitySequence(left.id)))||right.created_at.localeCompare(left.created_at));const allAgents=element('option','All agents');allAgents.value='';agentSelector.replaceChildren(allAgents);for(const agent of ordered){const option=element('option',`${agent.role} · ${agent.status} · ${agent.id.slice(0,12)}`);option.value=agent.id;agentSelector.append(option);}agentSelector.value=ordered.some(agent=>agent.id===previous)?previous:'';}
    async function backfillEvents(state){const after=Math.max(0,(state.lastSequence||0)-250);const agents=Array.isArray(state.agents)?state.agents:[];const histories=await Promise.all(agents.map(agent=>api(`/api/agents/${agent.id}/events?after=${after}&limit=250`).catch(()=>({events:[]}))));histories.flatMap(history=>Array.isArray(history.events)?history.events:[]).sort((left,right)=>left.sequence-right.sequence).forEach(ingestEvent);}
    function render(state){currentAgents=Array.isArray(state.agents)?state.agents:[];renderIdSelectors(state);renderAgentSelector(currentAgents);renderItems('#jobs',state.jobs,job=>{const node=element('div','','item');node.append(element('strong',`${job.title} (${job.status})`),element('div',job.id,'muted'),element('div',job.goal),action('Schedule ready task',async()=>{try{const result=await api(`/api/jobs/${job.id}/schedule?limit=1`,{method:'POST'});notice(Array.isArray(result.launched)&&result.launched.length?'Scheduled one ready task.':'No ready task to schedule.');await refresh();}catch(error){notice(error.message,true);}}));if(job.status==='draft')node.append(action('Start evidence triage',async()=>{try{const result=await api(`/api/jobs/${job.id}/bootstrap`,{method:'POST'});notice(Array.isArray(result.launched)&&result.launched.length?'Initial evidence triage scheduled.':'Initial task created but not launched.');await refresh();}catch(error){notice(error.message,true);}}));return node;});renderItems('#tasks',state.tasks,task=>{const node=element('div','','item');node.append(element('strong',`${task.title} — ${task.status}`),element('div',task.id,'muted'),element('div',task.instructions));if(task.status==='in_progress')node.append(action('Recover',async()=>{const reason=prompt('Why should this stalled attempt be stopped?');if(reason){await api(`/api/tasks/${task.id}/recover`,{method:'POST',body:JSON.stringify({reason})});await refresh();}},'danger'));if(['blocked','deferred','failed'].includes(task.status))node.append(action('Requeue',async()=>{const reason=prompt('Reason for retry/requeue:');if(reason){await api(`/api/tasks/${task.id}/retry`,{method:'POST',body:JSON.stringify({reason})});await refresh();}}));return node;});const taskTitles=new Map((state.tasks||[]).map(task=>[task.id,task.title]));renderItems('#task-edges',state.taskEdges,edge=>{const node=element('div','','item');node.append(element('strong',`${taskTitles.get(edge.task_id)||edge.task_id} — ${edge.relation}`),element('div',`needs ${taskTitles.get(edge.dependency_task_id)||edge.dependency_task_id}`,'muted'));return node;});renderItems('#agents',state.agents,agent=>{const node=element('div','','item');node.append(element('strong',`${agent.role} — ${agent.status}`),element('div',agent.id,'muted'),element('div',agent.task));return node;});renderItems('#hypotheses',state.hypotheses,hypothesis=>{const node=element('div','','item');node.append(element('strong',`${hypothesis.subject} r${hypothesis.revision} (${hypothesis.status})`),element('div',hypothesis.statement),element('div',`Evidence: ${hypothesis.evidence_ids.join(', ')||'none'}`,'muted'));return node;});renderItems('#scope-requests',state.writeScopeRequests,request=>{const node=element('div','','item');node.append(element('strong',`${request.path} — ${request.status}`),element('div',request.reason),element('div',request.agent_id,'muted'));if(request.status==='pending')node.append(action('Approve',()=>resolveScope(request.id,'approved')),action('Reject',()=>resolveScope(request.id,'rejected'),'danger'));if(request.resolution_reason)node.append(element('div',request.resolution_reason,'muted'));return node;});const g=state.ghidra,configured=g.configured?'configured':'not configured';$('#ghidra').textContent=`Ghidra: ${configured}; database=${g.databaseId||'—'}; opened=${g.opened}; restarts=${g.restartCount}`;renderTimeline();}
    async function resolveScope(id,decision){const reason=prompt(decision==='rejected'?'Rejection reason (required):':'Approval note (optional):');if(decision==='rejected'&&!reason)return;try{await api(`/api/write-scope-requests/${id}/resolve`,{method:'POST',body:JSON.stringify({decision,reason})});notice(`Scope ${decision}.`);await refresh();}catch(error){notice(error.message,true);}}
    async function refresh(){try{const state=await api('/api/status');await backfillEvents(state);render(state);}catch(error){notice(error.message,true);}}
    function scheduleRefresh(){if(refreshTimer!==null)return;refreshTimer=setTimeout(()=>{refreshTimer=null;refresh();},250);} agentSelector.addEventListener('change',renderTimeline);
    function form(id,handler){$(id).addEventListener('submit',async event=>{event.preventDefault();const submittedForm=event.currentTarget;try{await handler(new FormData(submittedForm));submittedForm.reset();await refresh();}catch(error){notice(error.message,true);}});}
    form('#job-form',data=>api('/api/jobs',{method:'POST',body:JSON.stringify({title:data.get('title'),goal:data.get('goal')})}));form('#task-form',data=>api(`/api/jobs/${data.get('jobId')}/tasks`,{method:'POST',body:JSON.stringify({title:data.get('title'),instructions:data.get('instructions'),role:data.get('role'),write_scope:String(data.get('writeScope')).split(',').map(value=>value.trim()).filter(Boolean)})}));form('#dependency-form',data=>api(`/api/tasks/${data.get('taskId')}/dependencies`,{method:'POST',body:JSON.stringify({dependency_task_id:data.get('dependencyId'),relation:data.get('relation')})}));form('#schedule-form',data=>api(`/api/jobs/${data.get('jobId')}/schedule?limit=${data.get('limit')}`,{method:'POST'}));form('#agent-form',data=>api(`/api/agents/${data.get('agentId')}/control`,{method:'POST',body:JSON.stringify({action:data.get('action'),message:data.get('message')||null})}));
    const socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);socket.onopen=()=>$('#connection').textContent='Live WebSocket connected';socket.onmessage=event=>{ingestEvent(JSON.parse(event.data));scheduleRefresh();};socket.onclose=()=>$('#connection').textContent='Disconnected; refresh to reconnect';refresh();
  </script>
</body>
</html>
