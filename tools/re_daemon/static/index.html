<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lego Loco Autonomous RE</title>
  <style>
    body { font-family: ui-monospace, monospace; margin: 2rem; background: #10151c; color: #d9e1e8; }
    h1,h2 { color: #8ec5ff; } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(22rem,1fr)); gap:1rem; }
    section { border:1px solid #3b4654; border-radius:.5rem; padding:1rem; background:#17212b; } pre { max-height:20rem; overflow:auto; white-space:pre-wrap; }
    form { display:grid; gap:.4rem; margin-bottom:1rem; } input, textarea, select, button { font:inherit; padding:.35rem; } textarea { min-height:4rem; }
    button { cursor:pointer; background:#254c70; color:#fff; border:1px solid #6088ac; border-radius:.25rem; } button.danger { background:#74343a; } button.warn { background:#725c28; }
    .list { max-height:20rem; overflow:auto; } .item { border-top:1px solid #344454; padding:.5rem 0; } .muted { color:#9cabba; } .empty { color:#9cabba; font-style:italic; } #notice { min-height:1.2rem; } .ok { color:#83e58c; } .error { color:#ff9696; }
  </style>
</head>
<body>
  <h1>Autonomous Reverse Engineering</h1>
  <p id="connection">Connecting…</p><p id="ghidra"></p><p id="notice"></p>
  <div class="grid">
    <section><h2>Create job</h2><form id="job-form"><input name="title" placeholder="Title" required><textarea name="goal" placeholder="Evidence-led objective" required></textarea><button>Create job</button></form>
      <h2>Schedule ready work</h2><form id="schedule-form"><input name="jobId" placeholder="Job ID" required><input name="limit" type="number" min="1" max="8" value="1"><button>Schedule</button></form>
      <div id="jobs" class="list"></div></section>
    <section><h2>Create task</h2><form id="task-form"><input name="jobId" placeholder="Job ID" required><input name="title" placeholder="Title" required><textarea name="instructions" placeholder="Concrete evidence-led instructions" required></textarea><select name="role"><option>investigator</option><option>transcriber</option><option>validator</option><option>integrator</option><option>reviewer</option></select><input name="writeScope" placeholder="Approved paths, comma separated"><button>Create task</button></form>
      <h2>Add dependency</h2><form id="dependency-form"><input name="taskId" placeholder="Waiting task ID" required><input name="dependencyId" placeholder="Prerequisite task ID" required><select name="relation"><option>requires</option><option>evidence</option><option>invalidates</option></select><button>Add edge</button></form></section>
    <section><h2>Control agent</h2><form id="agent-form"><input name="agentId" placeholder="Agent ID" required><select name="action"><option>steer</option><option>follow_up</option><option>abort</option></select><textarea name="message" placeholder="Steer/follow-up message (not required for abort)"></textarea><button>Send</button></form>
      <h2>Tasks</h2><div id="tasks" class="list"></div></section>
  </div>
  <div class="grid"><section><h2>Write-scope requests</h2><div id="scope-requests" class="list"></div></section><section><h2>Hypotheses</h2><div id="hypotheses" class="list"></div></section><section><h2>Agents</h2><div id="agents" class="list"></div></section></div>
  <section><h2>Live event tail</h2><pre id="tail"></pre></section>
  <script>
    const $ = selector => document.querySelector(selector); const tail = $('#tail'); let sequence = 0; const tailLines = []; let refreshTimer = null;
    const notice = (message, bad=false) => { const node=$('#notice'); node.textContent=message; node.className=bad?'error':'ok'; setTimeout(()=>node.textContent='', 5000); };
    async function api(path, options={}) { const response = await fetch(path, {headers:{'content-type':'application/json'}, ...options}); if (!response.ok) throw new Error((await response.text()) || response.statusText); return response.json(); }
    const element = (tag, text='', className='') => { const node=document.createElement(tag); node.textContent=text; node.className=className; return node; };
    function action(label, handler, className='') { const button=element('button',label,className); button.type='button'; button.onclick=handler; return button; }
    function renderItems(selector, records, render) { const root=$(selector); root.replaceChildren(...(records.length ? records.map(render) : [element('div','empty','empty')])); }
    function eventText(event) { const payload=event.payload||{}; if(event.kind==='assistant_delta') return `${event.sequence} ${event.agent_id||'daemon'} assistant: ${payload.delta||''}`; const text=JSON.stringify(event); return text.length>2000?`${text.slice(0,2000)}…`:text; }
    function appendEvent(event) { if(event.sequence<=sequence) return; sequence=event.sequence; tailLines.push(eventText(event)); if(tailLines.length>200) tailLines.splice(0,tailLines.length-200); tail.textContent=tailLines.join('\n'); tail.scrollTop=tail.scrollHeight; }
    async function backfillEvents(state) { const after=Math.max(0,state.lastSequence-200); const histories=await Promise.all(state.agents.map(agent=>api(`/api/agents/${agent.id}/events?after=${after}&limit=200`).catch(()=>({events:[]})))); const events=histories.flatMap(history=>history.events).sort((left,right)=>left.sequence-right.sequence).slice(-200); events.forEach(appendEvent); }
    function render(state) {
      renderItems('#jobs', state.jobs, job => { const node=element('div','', 'item'); node.append(element('strong',`${job.title} (${job.status})`), element('div',job.id,'muted'), element('div',job.goal)); return node; });
      renderItems('#tasks', state.tasks, task => { const node=element('div','', 'item'); node.append(element('strong',`${task.title} — ${task.status}`),element('div',task.id,'muted'),element('div',task.instructions)); if(['blocked','deferred','failed'].includes(task.status)) node.append(action('Requeue',async()=>{const reason=prompt('Reason for retry/requeue:');if(reason){await api(`/api/tasks/${task.id}/retry`,{method:'POST',body:JSON.stringify({reason})}); await refresh();}})); return node; });
      renderItems('#agents', state.agents, agent => { const node=element('div','', 'item'); node.append(element('strong',`${agent.role} — ${agent.status}`),element('div',agent.id,'muted'),element('div',agent.task)); return node; });
      renderItems('#hypotheses', state.hypotheses, hypothesis => { const node=element('div','', 'item'); node.append(element('strong',`${hypothesis.subject} r${hypothesis.revision} (${hypothesis.status})`),element('div',hypothesis.statement),element('div',`Evidence: ${hypothesis.evidence_ids.join(', ') || 'none'}`,'muted')); return node; });
      renderItems('#scope-requests', state.writeScopeRequests, request => { const node=element('div','', 'item'); node.append(element('strong',`${request.path} — ${request.status}`),element('div',request.reason),element('div',request.agent_id,'muted')); if(request.status==='pending'){node.append(action('Approve',()=>resolveScope(request.id,'approved')),action('Reject',()=>resolveScope(request.id,'rejected'),'danger'));} if(request.resolution_reason) node.append(element('div',request.resolution_reason,'muted')); return node; });
      const g=state.ghidra, configured=g.configured?'configured':'not configured'; $('#ghidra').textContent=`Ghidra: ${configured}; database=${g.databaseId||'—'}; opened=${g.opened}; restarts=${g.restartCount}`;
    }
    async function resolveScope(id, decision) { const reason=prompt(decision==='rejected'?'Rejection reason (required):':'Approval note (optional):'); if(decision==='rejected'&&!reason)return; try{await api(`/api/write-scope-requests/${id}/resolve`,{method:'POST',body:JSON.stringify({decision,reason})});notice(`Scope ${decision}.`);await refresh();}catch(error){notice(error.message,true);} }
    async function refresh() { try { const state=await api('/api/status'); await backfillEvents(state); render(state); } catch(error) { notice(error.message,true); } }
    function scheduleRefresh() { if(refreshTimer!==null) return; refreshTimer=setTimeout(()=>{refreshTimer=null;refresh();},250); }
    function form(id, handler) { $(id).addEventListener('submit', async event => { event.preventDefault(); try { await handler(new FormData(event.currentTarget)); event.currentTarget.reset(); await refresh(); } catch(error) { notice(error.message,true); } }); }
    form('#job-form', data => api('/api/jobs',{method:'POST',body:JSON.stringify({title:data.get('title'),goal:data.get('goal')})}));
    form('#task-form', data => api(`/api/jobs/${data.get('jobId')}/tasks`,{method:'POST',body:JSON.stringify({title:data.get('title'),instructions:data.get('instructions'),role:data.get('role'),write_scope:String(data.get('writeScope')).split(',').map(x=>x.trim()).filter(Boolean)})}));
    form('#dependency-form', data => api(`/api/tasks/${data.get('taskId')}/dependencies`,{method:'POST',body:JSON.stringify({dependency_task_id:data.get('dependencyId'),relation:data.get('relation')})}));
    form('#schedule-form', data => api(`/api/jobs/${data.get('jobId')}/schedule?limit=${data.get('limit')}`,{method:'POST'}));
    form('#agent-form', data => api(`/api/agents/${data.get('agentId')}/control`,{method:'POST',body:JSON.stringify({action:data.get('action'),message:data.get('message')||null})}));
    const socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`); socket.onopen=()=>$('#connection').textContent='Live WebSocket connected'; socket.onmessage=event=>{appendEvent(JSON.parse(event.data));scheduleRefresh();}; socket.onclose=()=>$('#connection').textContent='Disconnected; refresh to reconnect'; refresh();
  </script>
</body>
</html>
