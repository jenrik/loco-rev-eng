<body>
<div id="topbar">
  <span class="status"><span class="dot" id="conn-dot"></span><span id="conn-text">Connecting…</span></span>

<script>
(function(){
var $=function(s){return document.querySelector(s);};
var state={jobs:[],tasks:[],agents:[],taskEdges:[],hypotheses:[],writeScopeRequests:[],ghidra:{}};
var cy=null;
var selectedNodeId=null;
var sequence=0;


var ROLE_COLORS={investigator:'#4a7fb5',transcriber:'#4a9e6e',validator:'#c4a43e',integrator:'#c47e3e',reviewer:'#b54a4a'};

function esc(s){
  if(!s)return'';
  var el=document.createElement('span');
  el.textContent=s;
  return el.innerHTML;
}

async function api(path,opts){
  opts=opts||{};
  var res=await fetch(path,Object.assign({headers:{'content-type':'application/json'}},opts));
  if(!res.ok)throw new Error((await res.text())||res.statusText);
  return res.json();
}

function toast(msg,err){
  var t=$('#toast');
  t.textContent=msg;
  t.className=(err?'err':'ok')+' show';
  clearTimeout(t._tid);
  t._tid=setTimeout(function(){t.classList.remove('show');},3000);
}

// ── Build Cytoscape elements ──
function buildElements(){
  // Edge-only hierarchy. Jobs connect to initial tasks (no incoming requires).
  // Requires edges create deeper layers. Agents hang off terminal tasks.
  var nodes=[],edges=[];
  var jobIds=new Set(state.jobs.map(function(j){return j.id;}));
  var taskIds=new Set(state.tasks.map(function(t){return t.id;}));

  // Compute which tasks have incoming requires edges (dependents)
  var hasIncoming={};
  (state.taskEdges||[]).forEach(function(e){
    if(taskIds.has(e.task_id))hasIncoming[e.task_id]=true;
  });

  // Job nodes
  state.jobs.forEach(function(job){
    nodes.push({
      data:{id:job.id,label:job.title,status:job.status,type:'job',goal:job.goal},
      classes:'job'
    });
  });

  // Task nodes
  state.tasks.forEach(function(task){
    nodes.push({
      data:{id:task.id,label:task.title,status:task.status,type:'task',role:task.role,instructions:task.instructions,jobId:task.job_id},
      classes:'task role-'+task.role+' status-'+task.status
    });
    // Only connect job→task for initial tasks (no incoming requires edge)
    if(jobIds.has(task.job_id)&&!hasIncoming[task.id]){
      edges.push({
        data:{id:'e-contains-'+task.id,source:task.job_id,target:task.id,edgeType:'contains'},
        classes:'contains'
      });
    }
  });

  // Agent nodes
  state.agents.forEach(function(agent){
    var task=state.tasks.find(function(t){return t.assigned_agent_id===agent.id;});
    nodes.push({
      data:{id:agent.id,label:agent.role,status:agent.status,type:'agent',role:agent.role,taskDesc:agent.task||''},
      classes:'agent status-'+agent.status
    });
    if(task){
      edges.push({
        data:{id:'e-assign-'+agent.id,source:task.id,target:agent.id,edgeType:'assignment'},
        classes:'assignment'
      });
    }
  });

  // Task dependency edges
  (state.taskEdges||[]).forEach(function(edge){
    if(taskIds.has(edge.task_id)&&taskIds.has(edge.dependency_task_id)){
      edges.push({
        data:{id:'e-dep-'+edge.dependency_task_id+'-'+edge.task_id,source:edge.dependency_task_id,target:edge.task_id,edgeType:edge.relation,label:edge.relation},
        classes:edge.relation
      });
    }
  });

  // Hypothesis nodes
  (state.hypotheses||[]).forEach(function(hyp){
    nodes.push({
      data:{id:hyp.id,label:hyp.subject,status:hyp.status,type:'hypothesis',statement:hyp.statement,jobId:hyp.job_id},
      classes:'hypothesis'
    });
    if(jobIds.has(hyp.job_id)){
      edges.push({
        data:{id:'e-hyp-'+hyp.id,source:hyp.job_id,target:hyp.id,edgeType:'contains'},
        classes:'contains'
      });
    }
  });

  return {nodes:nodes,edges:edges};
}

// ── Cytoscape stylesheet ──
var CY_STYLE=[
  // Job compound nodes
  {selector:'.job',style:{
    'background-color':'#1a2332','background-opacity':1,
    'border-color':'#254c70','border-width':3,'border-opacity':1,
    'shape':'round-rectangle','text-wrap':'wrap','text-max-width':'160px',
    'label':'data(label)','color':'#c9d1d9','font-size':'12px','font-weight':'bold',
    'text-valign':'top','text-halign':'center','text-margin-y':'-6',
    'width':200,'height':60,
    'padding':'30px'
  }},
  {selector:'.job:selected',style:{
    'border-color':'#58a6ff','border-width':4
  }},
  // Task nodes
  {selector:'.task',style:{
    'background-color':'#1a2332','background-opacity':1,
    'shape':'round-rectangle',
    'label':'data(label)','color':'#c9d1d9','font-size':'10px',
    'text-wrap':'wrap','text-max-width':'130px',
    'text-valign':'center','text-halign':'center',
    'width':155,'height':44
  }},
  {selector:'.task:selected',style:{
    'border-color':'#58a6ff','border-width':3,'border-opacity':1
  }},
  {selector:'.role-investigator',style:{'border-color':'#4a7fb5','border-width':2,'border-opacity':1}},
  {selector:'.role-transcriber',style:{'border-color':'#4a9e6e','border-width':2,'border-opacity':1}},
  {selector:'.role-validator',style:{'border-color':'#c4a43e','border-width':2,'border-opacity':1}},
  {selector:'.role-integrator',style:{'border-color':'#c47e3e','border-width':2,'border-opacity':1}},
  {selector:'.role-reviewer',style:{'border-color':'#b54a4a','border-width':2,'border-opacity':1}},
  {selector:'.status-completed',style:{'border-opacity':0.5}},
  {selector:'.status-in_progress',style:{'border-style':'double'}},
  {selector:'.status-blocked',style:{'border-style':'dashed'}},
  // Agent nodes
  {selector:'.agent',style:{
    'background-color':'#1a2332','shape':'ellipse',
    'border-color':'#6ea8e6','border-width':2,'border-opacity':1,
    'label':'data(label)','color':'#8b949e','font-size':'7px',
    'text-valign':'center','text-halign':'center',
    'width':32,'height':32
  }},
  {selector:'.status-running',style:{'background-color':'#1a3329','border-color':'#3fb950'}},
  {selector:'.status-stopped',style:{'background-color':'#3b1c1c','border-color':'#f85149'}},
  // Hypothesis nodes
  {selector:'.hypothesis',style:{
    'background-color':'#1a2332','shape':'round-rectangle',
    'border-color':'#9878d7','border-width':2,'border-opacity':1,
    'label':'data(label)','color':'#c9d1d9','font-size':'9px',
    'text-wrap':'wrap','text-max-width':'110px',
    'text-valign':'center','text-halign':'center',
    'width':130,'height':36
  }},
  // Edges
  {selector:'edge',style:{
    'curve-style':'bezier','width':1.5,'line-color':'#30363d',
    'target-arrow-shape':'triangle','target-arrow-color':'#30363d',
    'arrow-scale':0.8
  }},
  {selector:'.contains',style:{'line-color':'#254c70','target-arrow-color':'#254c70','width':2}},
  {selector:'.requires',style:{'line-color':'#6ea8e6','target-arrow-color':'#6ea8e6','line-style':'dashed','line-dash-pattern':[6,3]}},
  {selector:'.evidence',style:{'line-color':'#d3a85a','target-arrow-color':'#d3a85a','line-style':'dashed','line-dash-pattern':[3,4]}},
  {selector:'.invalidates',style:{'line-color':'#f85149','target-arrow-color':'#f85149','line-style':'dashed','line-dash-pattern':[8,3]}},
  {selector:'.assignment',style:{'line-color':'#546779','target-arrow-color':'#546779','line-style':'dotted','width':1}}
];

// ── Initialize Cytoscape ──
function initCy(){
  if(cy){cy.destroy();}
  cy=cytoscape({
    container:$('#cy-container'),
    style:CY_STYLE,
    wheelSensitivity:0.3,
    minZoom:0.1,maxZoom:3,
    layout:{name:'preset'} // We'll set positions manually first, then run breadthfirst
  });

  window._cy=cy;

  cy.on('tap',function(ev){
    if(ev.target===cy){
      hidePanel();
    }
  });

  cy.on('tap','node',function(ev){
    selectedNodeId=ev.target.id();
    showPanel(selectedNodeId);
  });

  cy.on('cxttap',function(ev){
    var ele=ev.target;
    if(ele===cy){
      // Right-click on background
      var items=[{label:'➕ New Job',handler:function(){actions.promptNewJob();}}];
      if(state.jobs.length>0){
        items.push('-');
        state.jobs.forEach(function(job){
          items.push({label:'📋 Add Task → '+job.title,handler:function(){actions.addTaskToJob(job.id);}});
        });
      }
      showContextMenu(ev.originalEvent.clientX,ev.originalEvent.clientY,items);
    }else{
      // Right-click on node
      var type=ele.data('type'),id=ele.id();
      var items=[];
      if(type==='job'){
        items.push({label:'➕ Add Task',handler:function(){actions.addTaskToJob(id);}});
        items.push({label:'▶ Schedule',handler:function(){actions.scheduleJob(id);}});
        items.push({label:'🚀 Bootstrap',handler:function(){actions.bootstrapJob(id);}});
      }else if(type==='task'){
        items.push({label:'➕ Add Dependency',handler:function(){actions.promptAddEdge(ele);}});
        if(['blocked','deferred','failed'].indexOf(ele.data('status'))>=0)
          items.push({label:'🔄 Requeue',handler:function(){actions.retryTask(id);}});
      }else if(type==='agent'){
        items.push({label:'🔄 Steer',handler:function(){actions.controlAgent(id,'steer');}});
        items.push({label:'💬 Follow Up',handler:function(){actions.controlAgent(id,'follow_up');}});
        items.push({label:'⏹ Abort',handler:function(){actions.controlAgent(id,'abort');}});
      }
      if(items.length===0)items.push({label:'No actions',muted:true});
      showContextMenu(ev.originalEvent.clientX,ev.originalEvent.clientY,items);
    }
  });

  // Close context menu on any click outside
  document.addEventListener('click',function(e){
    if(contextMenuEl&&!contextMenuEl.contains(e.target))hideContextMenu();
  });

  

  // Initialize context menus
  
}

// HTML context menu (no cxtmenu plugin dependency)
var contextMenuEl=null;
function showContextMenu(x,y,items){
  if(!contextMenuEl){
    contextMenuEl=document.createElement('div');
    contextMenuEl.id='ctxmenu';
    contextMenuEl.style.cssText='position:fixed;display:none;background:#161b22;border:1px solid #30363d;border-radius:6px;min-width:190px;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.5);overflow:hidden;font-size:11px';
    document.body.appendChild(contextMenuEl);
  }
  var h='';
  items.forEach(function(it){
    if(it==='-')h+='<div style="height:1px;background:#30363d;margin:2px 0"></div>';
    else h+='<div class="ctx-item" style="padding:7px 14px;cursor:pointer;color:#c9d1d9;'+(it.muted?'color:#484f58;cursor:default':'')+'">'+it.label+'</div>';
  });
  contextMenuEl.innerHTML=h;
  contextMenuEl.style.display='block';
  contextMenuEl.style.left=Math.min(x,window.innerWidth-200)+'px';
  contextMenuEl.style.top=Math.min(y,window.innerHeight-contextMenuEl.scrollHeight-20)+'px';

  contextMenuEl.querySelectorAll('.ctx-item:not([style*="cursor:default"])').forEach(function(el,i){
    var nonMuted=[];
    items.forEach(function(it){if(!it.muted)nonMuted.push(it);});
    el.addEventListener('click',function(){
      if(nonMuted[i]&&nonMuted[i].handler)nonMuted[i].handler();
      hideContextMenu();
    });
  });
}
function hideContextMenu(){if(contextMenuEl)contextMenuEl.style.display='none';}

// ── Update graph data ──
function updateGraph(){
  var elements=buildElements();
  // Preserve existing node positions if any
  var oldPos={};
  if(cy&&cy.nodes().length>0){
    cy.nodes().forEach(function(n){oldPos[n.id()]=n.position();});
  }

  // Flat structure — no compound nodes
  cy.elements().remove();
  cy.add(elements.nodes.map(function(n){return {group:'nodes',data:n.data,classes:n.classes};}));
  cy.add(elements.edges.map(function(e){return {group:'edges',data:e.data,classes:e.classes};}));

  // Restore positions or run layout
  var hasPositions=Object.keys(oldPos).length>0;
  if(hasPositions){
    cy.nodes().forEach(function(n){
      if(oldPos[n.id()]){n.position(oldPos[n.id()]);n.lock();}
    });
  }else{
    runLayout();
  }

  $('#node-count').textContent=cy.nodes().length+' nodes · '+cy.edges().length+' edges';
}

function runLayout(){
  // Breadthfirst with job nodes as explicit roots.
  // directed:true means edges are followed source→target.
  // Roots start at top; everything reachable via outgoing edges flows downward.
  cy.layout({
    name:'breadthfirst',
    directed:true,
    spacingFactor:1.4,
    avoidOverlap:true,
    nodeDimensionsIncludeLabels:true,
    animate:true,
    animationDuration:500,
    fit:true,
    padding:40,
    roots:'.job'
  }).run();

  setTimeout(function(){cy.fit(cy.elements(),60);},600);
}

// ── Bottom panel ──
function showPanel(nodeId){
  selectedNodeId=nodeId;
  var ele=cy.getElementById(nodeId);
  if(ele.length===0){hidePanel();return;}

  var data=ele.data();
  var type=data.type;

  var panel=$('#bottom-panel');
  panel.classList.remove('collapsed');
  $('#panel-title').textContent=data.label||nodeId;
  $('#panel-type').textContent=type;

  var content=$('#panel-content');
  var html='<div class="col"><h3>Details</h3>';

  if(type==='job'){
    html+=field('ID',nodeId)+field('Status',data.status)+field('Goal','<pre>'+esc(data.goal||'')+'</pre>');
  }else if(type==='task'){
    html+=field('ID',nodeId)+field('Status',data.status)+field('Role',data.role)+field('Instructions','<pre>'+esc(data.instructions||'')+'</pre>');
  }else if(type==='agent'){
    html+=field('ID',nodeId)+field('Status',data.status)+field('Role',data.role)+field('Task',data.taskDesc);
  }else if(type==='hypothesis'){
    html+=field('Subject',data.label)+field('Statement','<pre>'+esc(data.statement||'')+'</pre>')+field('Status',data.status);
  }
  html+='</div>';

  html+='<div class="col"><h3>Actions</h3>';
  if(type==='job'){
    html+=btn('Schedule',function(){actions.scheduleJob(nodeId);},'primary');
    html+=btn('Bootstrap',function(){actions.bootstrapJob(nodeId);});
    html+=btn('Add Task',function(){actions.addTaskToJob(nodeId);});
  }else if(type==='task'){
    if(data.status==='in_progress')html+=btn('Recover',function(){actions.recoverTask(nodeId);},'danger');
    if(['blocked','deferred','failed'].indexOf(data.status)>=0)html+=btn('Requeue',function(){actions.retryTask(nodeId);});
  }else if(type==='agent'){
    html+=btn('Steer',function(){actions.controlAgent(nodeId,'steer');});
    html+=btn('Follow Up',function(){actions.controlAgent(nodeId,'follow_up');});
    html+=btn('Abort',function(){actions.controlAgent(nodeId,'abort');},'danger');
  }
  html+='</div>';

  html+='<div class="col"><h3>Connections</h3><div class="edges-list">';
  var connected=ele.connectedEdges();
  if(connected.length===0){
    html+='<span style="color:#8b949e;font-size:10px">No connections</span>';
  }else{
    connected.forEach(function(edge){
      var src=edge.source(),tgt=edge.target();
      var otherId=src.id()===nodeId?tgt.id():src.id();
      var other=cy.getElementById(otherId);
      var name=other.length>0?other.data('label'):otherId;
      var dir=src.id()===nodeId?'→':'←';
      html+='<div class="edge-item"><span class="rel">'+esc(edge.data('edgeType')||'')+'</span><span>'+dir+' '+esc(name)+'</span></div>';
    });
  }
  html+='</div></div>';

  content.innerHTML=html;
  content.querySelectorAll('button').forEach(function(b){b.addEventListener('click',b._action);});
  ele.select();
}

function field(key,value){return '<div class="field"><span class="key">'+key+'</span><span class="value">'+value+'</span></div>';}
function btn(label,action,cls){var b=document.createElement('button');b.textContent=label;b.className=cls||'';b._action=action;return b.outerHTML;}

function hidePanel(){
  selectedNodeId=null;
  $('#bottom-panel').classList.add('collapsed');
  $('#panel-title').textContent='Select a node';
  $('#panel-type').textContent='';
  $('#panel-content').innerHTML='';
  if(cy)cy.elements().unselect();
}

// ── Actions ──
var actions={
  promptNewJob:function(){
    var title=prompt('Job title:');
    if(!title)return;
    var goal=prompt('Job goal:');
    if(!goal)return;
    api('/api/jobs',{method:'POST',body:JSON.stringify({title:title,goal:goal})})
      .then(function(){toast('Job created');refreshState();})
      .catch(function(e){toast(e.message,true);});
  },
  addTaskToJob:function(jobId){
    var title=prompt('Task title:');
    if(!title)return;
    var instructions=prompt('Instructions:');
    if(!instructions)return;
    var role=prompt('Role (investigator/transcriber/validator/integrator/reviewer):','investigator');
    if(!role)return;
    api('/api/jobs/'+jobId+'/tasks',{
      method:'POST',body:JSON.stringify({title:title,instructions:instructions,role:role,write_scope:[]})
    }).then(function(){toast('Task created');refreshState();})
      .catch(function(e){toast(e.message,true);});
  },
  promptAddEdge:function(taskEle){
    var taskId=taskEle.id();
    var others=state.tasks.filter(function(t){return t.id!==taskId;});
    if(others.length===0){toast('No other tasks to connect to',true);return;}
    var list=others.map(function(t,i){return '['+i+'] '+t.title+' ('+t.role+')';}).join('\n');
    var idx=prompt('Choose prerequisite task:\n'+list+'\n\nEnter index:');
    if(idx===null)return;
    var dep=others[parseInt(idx)];
    if(!dep){toast('Invalid',true);return;}
    var rel=prompt('Relation (requires/evidence/invalidates):','requires');
    if(!rel)return;
    api('/api/tasks/'+taskId+'/dependencies',{
      method:'POST',body:JSON.stringify({dependency_task_id:dep.id,relation:rel})
    }).then(function(){toast('Edge created');refreshState();})
      .catch(function(e){toast(e.message,true);});
  },
  scheduleJob:async function(jobId){
    try{var r=await api('/api/jobs/'+jobId+'/schedule?limit=1',{method:'POST'});toast(Array.isArray(r.launched)&&r.launched.length?'Scheduled':'No ready tasks');await refreshState();}
    catch(e){toast(e.message,true);}
  },
  bootstrapJob:async function(jobId){
    try{await api('/api/jobs/'+jobId+'/bootstrap',{method:'POST'});toast('Bootstrap scheduled');await refreshState();}
    catch(e){toast(e.message,true);}
  },
  recoverTask:async function(taskId){
    var reason=prompt('Recovery reason:');if(!reason)return;
    try{await api('/api/tasks/'+taskId+'/recover',{method:'POST',body:JSON.stringify({reason:reason})});toast('Recovery requested');await refreshState();}
    catch(e){toast(e.message,true);}
  },
  retryTask:async function(taskId){
    var reason=prompt('Retry reason:');if(!reason)return;
    try{await api('/api/tasks/'+taskId+'/retry',{method:'POST',body:JSON.stringify({reason:reason})});toast('Requeued');await refreshState();}
    catch(e){toast(e.message,true);}
  },
  controlAgent:async function(agentId,action){
    var msg=action==='abort'?null:prompt(action+' message:');
    try{await api('/api/agents/'+agentId+'/control',{method:'POST',body:JSON.stringify({action:action,message:msg})});toast('Agent '+action);await refreshState();}
    catch(e){toast(e.message,true);}
  }
};
window._re=actions;

// ── State ──
async function refreshState(){
  try{
    var ns=await api('/api/status');
    state=ns;
    $('#ghidra-status').textContent='Ghidra: '+(ns.ghidra&&ns.ghidra.configured?'ready':'off')+' · DB: '+(ns.ghidra?ns.ghidra.databaseId||'—':'—');
    updateJobFilter();
    updateGraph();
    if(selectedNodeId)showPanel(selectedNodeId);
  }catch(e){toast(e.message,true);}
}

function updateJobFilter(){
  var sel=$('#job-filter'),prev=sel.value;
  sel.innerHTML='<option value="">All jobs</option>'+state.jobs.map(function(j){return '<option value="'+j.id+'">'+esc(j.title)+'</option>';}).join('');
  sel.value=prev;
}

// ── WebSocket ──
function connectWS(){
  var proto=location.protocol==='https:'?'wss':'ws';
  var ws=new WebSocket(proto+'://'+location.host+'/ws');
  ws.onopen=function(){$('#conn-dot').classList.remove('disconnected');$('#conn-text').textContent='Live';};
  ws.onmessage=function(e){
    var ev=JSON.parse(e.data);
    if(ev.sequence<=sequence)return;sequence=ev.sequence;
    if(ws._t)clearTimeout(ws._t);
    ws._t=setTimeout(refreshState,200);
  };
  ws.onclose=function(){$('#conn-dot').classList.add('disconnected');$('#conn-text').textContent='Reconnecting…';setTimeout(connectWS,3000);};
  ws.onerror=function(){$('#conn-dot').classList.add('disconnected');$('#conn-text').textContent='Error';};
}

// ── Topbar ──
$('#search').addEventListener('input',function(){
  var q=$('#search').value.toLowerCase();
  var jf=$('#job-filter').value;
  if(!cy)return;
  cy.nodes().forEach(function(n){
    var label=(n.data('label')||'').toLowerCase();
    var match=!q||label.indexOf(q)>=0||n.id().toLowerCase().indexOf(q)>=0;
    if(match&&jf){
      if(n.data('type')==='job')match=n.id()===jf;
      else if(n.data('type')==='task'||n.data('type')==='hypothesis')match=n.data('jobId')===jf;
      else if(n.data('type')==='agent'){
        var t=state.tasks.find(function(ta){return ta.assigned_agent_id===n.id();});
        match=t&&t.job_id===jf;
      }
    }
    n.style('opacity',match?1:0.12);
  });
  cy.edges().style('opacity',0.08);
});

$('#job-filter').addEventListener('change',function(){$('#search').dispatchEvent(new Event('input'));});
$('#btn-fit').addEventListener('click',function(){if(cy){cy.fit(cy.elements(),40);}});

$('#btn-reset').addEventListener('click',function(){
  if(!cy)return;
  cy.nodes().unlock();
  runLayout();
});

$('#panel-handle').addEventListener('click',function(){
  $('#bottom-panel').classList.toggle('collapsed');
});

window.addEventListener('keydown',function(e){
  if(e.key==='Escape'){hideContextMenu();hidePanel();}
  if(e.key==='f'&&e.ctrlKey){e.preventDefault();$('#search').focus();}
});

// ── Init ──
initCy();
connectWS();
refreshState();
})();
</script>
